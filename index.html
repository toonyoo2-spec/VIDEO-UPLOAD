<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Socra Brandteam Archive</title>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #121212;
            --border-color: #222225;
            --border-hover: #3f3f46;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --container-max-width: 1200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; }

        .grid-layout-align {
            max-width: var(--container-max-width);
            margin-left: auto;
            margin-right: auto;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        header { padding-top: 3.5rem; padding-bottom: 1.8rem; display: flex; justify-content: space-between; align-items: center; }
        .header-tag { color: var(--accent-red); font-size: 2.6rem; font-weight: 800; letter-spacing: -1px; display: inline-block; }

        .btn-admin-action {
            background: var(--accent-red); color: white; border: none; padding: 0.6rem 1.2rem;
            border-radius: 8px; font-weight: 700; cursor: pointer; display: none; transition: background 0.2s;
        }
        .btn-admin-action:hover { background: #dc2626; }

        .nav-bar-wrapper {
            position: sticky; top: 0;
            background: rgba(10, 10, 10, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color); z-index: 100; padding-top: 1rem; padding-bottom: 1rem;
        }

        .nav-bar-container { display: flex; flex-direction: column; gap: 0.6rem; }
        .nav-row { display: flex; align-items: center; justify-content: flex-start; gap: 0.6rem; flex-wrap: wrap; width: 100%; }
        .nav-row-scroll { display: flex; align-items: center; justify-content: flex-start; gap: 0.6rem; overflow-x: auto; white-space: nowrap; scrollbar-width: none; touch-action: pan-x; cursor: grab; user-select: none; width: 100%; }

        .tab-btn, .quick-link-btn {
            height: 36px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;
            border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
        }

        .tab-btn { background: #18181b; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0 1rem; }
        .tab-btn.active { background: var(--accent-red); color: #ffffff; border-color: var(--accent-red); }

        .quick-link-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0 0.9rem; gap: 0.5rem; }
        .quick-link-btn .date-label { color: var(--accent-red); font-family: monospace; font-weight: 700; }

        main { margin-top: 2.5rem; margin-bottom: 2.5rem; }
        .project-section { margin-bottom: 4.5rem; scroll-margin-top: 180px; }

        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); }
        .section-header-left { display: flex; align-items: center; gap: 0.8rem; }
        .date-badge { font-size: 1rem; font-weight: 800; color: #ffffff; background: #18181b; padding: 0.3rem 0.75rem; border-radius: 6px; border: 1px solid var(--border-hover); font-family: monospace; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; align-items: start; }
        .video-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
        .video-card:hover { border-color: var(--accent-red); transform: translateY(-4px); }

        .thumb-cover { position: relative; width: 100%; background: #171717; overflow: hidden; aspect-ratio: 16 / 9; }
        .thumb-cover.portrait { aspect-ratio: 9 / 16; }
        .thumb-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: rgba(239, 68, 68, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .play-btn::after { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent #ffffff; margin-left: 2px; }

        .video-info { padding: 1rem; }
        .video-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent-red); margin-bottom: 0.2rem; }
        .video-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); line-height: 1.4; }

        /* 등록 폼 모달 */
        .admin-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .admin-modal-overlay.active { display: flex; }
        .admin-modal-box { background: #121212; border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 12px; width: 90%; max-width: 480px; display: flex; flex-direction: column; gap: 1rem; }
        .admin-modal-title { font-size: 1.1rem; font-weight: 800; color: white; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .admin-input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .admin-input-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
        .admin-input { background: #18181b; border: 1px solid var(--border-color); color: white; padding: 0.6rem; border-radius: 6px; outline: none; }
        .admin-btn-row { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
        .btn-cancel { background: #27272a; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .btn-submit { background: var(--accent-red); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 700; }

        /* 모달 및 기본 팝업 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal-overlay.active { display: flex; }
        .modal-container { position: relative; background: #0b0b0b; border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; width: 95vw; max-width: 1000px; height: 90vh; max-height: 820px; }
        .modal-header { height: 48px; padding: 0 1.25rem; background: #121212; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .modal-header-title { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }
        .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; }
        .modal-body-dual { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; background: #000000; }
        .modal-body-dual.single-mode { grid-template-columns: 1fr; }
        .dual-column { display: flex; flex-direction: column; background: #121212; border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden; }
        .column-media { position: relative; flex: 1; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        .column-media video { width: 100%; height: 100%; object-fit: contain; }

        /* 업로드 상태 표시 로딩 레이어 */
        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); color: white; z-index: 20000; align-items: center; justify-content: center; font-weight: 700; flex-direction: column; gap: 1rem; }
    </style>
</head>
<body>

    <header class="grid-layout-align">
        <div class="header-tag" id="mainHeaderTitle">Socra Brandteam Archive</div>
        <button id="btnAddProject" class="btn-admin-action" onclick="openProjectModal()">+ 새 프로젝트 추가</button>
    </header>

    <div class="nav-bar-wrapper">
        <div class="nav-bar-container grid-layout-align">
            <div class="nav-row">
                <button id="btnAll" class="tab-btn active" onclick="filterYear('ALL')">ALL</button>
                <div id="yearTabs" style="display:contents;"></div>
            </div>
            <div id="quickLinks" class="nav-row-scroll"></div>
        </div>
    </div>

    <main id="archiveContainer" class="grid-layout-align"></main>

    <footer class="grid-layout-align">
        &copy; 2026 SOCRA BRAND TEAM. ALL RIGHTS RESERVED. <span style="color:var(--text-secondary);">by Kwanyun</span>
        &nbsp;·&nbsp;
        <span id="adminToggleBtn" style="cursor:pointer; text-decoration:underline; color:var(--text-secondary);" onclick="handleAdminToggle()">관리자 로그인</span>
    </footer>

    <!-- 로딩 스피너 -->
    <div id="loadingSpinner">
        <div style="font-size: 1.2rem;">⏳ Cloudflare R2 스토리지로 영상 업로드 중...</div>
        <div style="font-size: 0.85rem; color: #a1a1aa;">대용량 파일의 경우 몇 초 정도 소요될 수 있습니다.</div>
    </div>

    <!-- 1. 새 프로젝트 추가 모달 -->
    <div id="projectModal" class="admin-modal-overlay">
        <div class="admin-modal-box">
            <div class="admin-modal-title">새 프로젝트 생성</div>
            <div class="admin-input-group">
                <label>날짜 (YYMMDD 형식, 예: 260801)</label>
                <input type="text" id="inputProjDate" class="admin-input" placeholder="260801">
            </div>
            <div class="admin-input-group">
                <label>프로젝트 제목</label>
                <input type="text" id="inputProjTitle" class="admin-input" placeholder="8월 영상 시안 모음">
            </div>
            <div class="admin-btn-row">
                <button class="btn-cancel" onclick="closeProjectModal()">취소</button>
                <button class="btn-submit" onclick="submitNewProject()">프로젝트 생성</button>
            </div>
        </div>
    </div>

    <!-- 2. 새 영상 파일 업로드 모달 -->
    <div id="videoModalUpload" class="admin-modal-overlay">
        <div class="admin-modal-box">
            <div class="admin-modal-title">새 동영상 추가 (R2 자동 업로드)</div>
            <input type="hidden" id="uploadTargetDate">
            <div class="admin-input-group">
                <label>태그 (예: OPTION 01)</label>
                <input type="text" id="inputVidTag" class="admin-input" placeholder="OPTION 01">
            </div>
            <div class="admin-input-group">
                <label>비디오 제목</label>
                <input type="text" id="inputVidTitle" class="admin-input" placeholder="INTRO_REF_01">
            </div>
            <div class="admin-input-group">
                <label>화면 비율 모드</label>
                <select id="selectVidMode" class="admin-input">
                    <option value="landscape">가로 영상 (16:9)</option>
                    <option value="portrait">세로 숏폼 (9:16)</option>
                </select>
            </div>
            <div class="admin-input-group">
                <label>영상 파일 (.mp4)</label>
                <input type="file" id="inputFileVideo" class="admin-input" accept="video/mp4,video/*">
            </div>
            <div class="admin-btn-row">
                <button class="btn-cancel" onclick="closeVideoUploadModal()">취소</button>
                <button class="btn-submit" onclick="submitNewVideo()">R2 업로드 및 등록</button>
            </div>
        </div>
    </div>

    <!-- 영상 재생 모달 -->
    <div id="videoModal" class="modal-overlay" onclick="closeVideo(event)">
        <div class="modal-container">
            <div class="modal-header">
                <span id="modalHeaderTitle" class="modal-header-title">시안 영상</span>
                <button class="close-btn" onclick="forceClose()">✕</button>
            </div>
            <div id="modalBodyDual" class="modal-body-dual single-mode">
                <div id="rightColumn" class="dual-column">
                    <div class="column-media" onclick="togglePlay('videoRight')">
                        <video id="videoRight" preload="auto" playsinline controls></video>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 설정 정보 ===
        const R2_STORAGE_URL = "https://pub-427fa438eaa44e659bfdd77141c7ca95.r2.dev/";
        const SUPABASE_URL = "https://kblwddlquwlvumhwkirl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibHdkZGxxdXdsdnVtaHdraXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3Mzg1NjksImV4cCI6MjEwMDMxNDU2OX0.OWH0eJXCGcJzjaMHqXWsurNuOEg4kNLuxpac6bxod1E";

        const ADMIN_PASSWORD = "socra2026!";
        const ADMIN_FLAG_KEY = 'socra_admin_flag';
        let isAdmin = localStorage.getItem(ADMIN_FLAG_KEY) === 'true';

        let projectsArchive = [];
        let currentFilterYear = 'ALL';

        // === 관리자 로그인 / 헤더 제어 ===
        function handleAdminToggle() {
            if (isAdmin) {
                if (confirm('관리자 모드를 종료할까요?')) {
                    isAdmin = false;
                    localStorage.removeItem(ADMIN_FLAG_KEY);
                    applyAdminMode();
                    renderArchive();
                }
            } else {
                const pw = prompt('관리자 비밀번호를 입력하세요');
                if (pw === ADMIN_PASSWORD) {
                    isAdmin = true;
                    localStorage.setItem(ADMIN_FLAG_KEY, 'true');
                    applyAdminMode();
                    renderArchive();
                } else if (pw !== null) {
                    alert('비밀번호가 틀렸습니다.');
                }
            }
        }

        function applyAdminMode() {
            const toggleBtn = document.getElementById('adminToggleBtn');
            const addProjBtn = document.getElementById('btnAddProject');
            if (isAdmin) {
                toggleBtn.textContent = '관리자 모드 (로그아웃)';
                addProjBtn.style.display = 'block';
            } else {
                toggleBtn.textContent = '관리자 로그인';
                addProjBtn.style.display = 'none';
            }
        }

        // === Supabase DB 연동 (프로젝트 및 비디오 로드) ===
        async function loadArchiveFromDB() {
            try {
                // 프로젝트 목록 가져오기
                const projRes = await fetch(`${SUPABASE_URL}/rest/v1/archive_projects?select=*&order=date.desc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const projects = await projRes.json();

                // 비디오 목록 가져오기
                const vidRes = await fetch(`${SUPABASE_URL}/rest/v1/archive_videos?select=*`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const videos = await vidRes.json();

                // 데이터 바인딩
                projectsArchive = projects.map(p => ({
                    date: p.date,
                    title: p.title,
                    items: videos.filter(v => v.project_date === p.date).map(v => ({
                        id: v.id,
                        tag: v.tag,
                        title: v.title,
                        isSingle: v.is_single,
                        fullUrl: v.full_url,
                        introUrl: v.intro_url,
                        mode: v.mode
                    }))
                }));

                renderArchive();
            } catch (e) {
                console.error("데이터 로드 중 오류:", e);
            }
        }

        // === 화면 렌더링 ===
        function parseDate(dateStr) {
            const year = '20' + dateStr.substring(0, 2);
            const month = dateStr.substring(2, 4);
            const day = dateStr.substring(4, 6);
            return { year, month, day, formattedFull: `${year}.${month}.${day}` };
        }

        function renderArchive() {
            const container = document.getElementById('archiveContainer');
            const quickLinksContainer = document.getElementById('quickLinks');
            container.innerHTML = '';
            quickLinksContainer.innerHTML = '';
            const yearsSet = new Set();

            projectsArchive.forEach((group) => {
                const dateInfo = parseDate(group.date);
                yearsSet.add(dateInfo.year);

                if (currentFilterYear !== 'ALL' && dateInfo.year !== currentFilterYear) return;

                const qLink = document.createElement('button');
                qLink.className = 'quick-link-btn';
                qLink.innerHTML = `<span class="date-label">${dateInfo.formattedFull}</span> ${group.title}`;
                qLink.onclick = () => {
                    const targetSec = document.getElementById(`section-${group.date}`);
                    if (targetSec) targetSec.scrollIntoView({ behavior: 'smooth' });
                };
                quickLinksContainer.appendChild(qLink);

                const section = document.createElement('section');
                section.className = 'project-section';
                section.id = `section-${group.date}`;

                let gridCardsHtml = '';
                group.items.forEach((item) => {
                    const jsonItem = JSON.stringify(item).replace(/"/g, '&quot;');
                    gridCardsHtml += `
                        <div class="video-card" onclick="openModal(${jsonItem})">
                            <div class="thumb-cover ${item.mode || 'landscape'}">
                                <video src="${item.fullUrl}#t=0.1" class="thumb-video" preload="metadata" muted playsinline></video>
                                <div class="play-btn"></div>
                            </div>
                            <div class="video-info">
                                <div class="video-tag">${item.tag}</div>
                                <div class="video-title">${item.title}</div>
                            </div>
                        </div>
                    `;
                });

                const addVideoBtnHtml = isAdmin 
                    ? `<button class="btn-admin-action" style="display:inline-block; font-size:0.8rem; padding:0.4rem 0.8rem;" onclick="openVideoUploadModal('${group.date}')">+ 영상 추가</button>` 
                    : '';

                section.innerHTML = `
                    <div class="section-header">
                        <div class="section-header-left">
                            <span class="date-badge">${dateInfo.formattedFull}</span>
                            <h2 class="section-title">${group.title}</h2>
                        </div>
                        ${addVideoBtnHtml}
                    </div>
                    <div class="video-grid">${gridCardsHtml}</div>
                `;
                container.appendChild(section);
            });
        }

        // === 신규 프로젝트 등록 (Supabase DB) ===
        function openProjectModal() { document.getElementById('projectModal').classList.add('active'); }
        function closeProjectModal() { document.getElementById('projectModal').classList.remove('active'); }

        async function submitNewProject() {
            const date = document.getElementById('inputProjDate').value.trim();
            const title = document.getElementById('inputProjTitle').value.trim();

            if (!date || !title) return alert('날짜와 제목을 모두 입력해 주세요.');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/archive_projects`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ date, title })
                });

                if (res.ok) {
                    alert('새 프로젝트가 생성되었습니다!');
                    closeProjectModal();
                    loadArchiveFromDB();
                } else {
                    alert('프로젝트 생성 실패. 이미 존재하는 날짜인지 확인하세요.');
                }
            } catch (e) {
                console.error(e);
            }
        }

        // === 신규 비디오 파일 업로드 (Cloudflare R2 + DB 연동) ===
        function openVideoUploadModal(date) {
            document.getElementById('uploadTargetDate').value = date;
            document.getElementById('videoModalUpload').classList.add('active');
        }
        function closeVideoUploadModal() { document.getElementById('videoModalUpload').classList.remove('active'); }

        async function submitNewVideo() {
            const date = document.getElementById('uploadTargetDate').value;
            const tag = document.getElementById('inputVidTag').value.trim();
            const title = document.getElementById('inputVidTitle').value.trim();
            const mode = document.getElementById('selectVidMode').value;
            const fileInput = document.getElementById('inputFileVideo');

            if (!tag || !title || fileInput.files.length === 0) return alert('모든 정보와 파일 선택을 완료해주세요.');

            const file = fileInput.files[0];
            const fileName = `${Date.now()}_${encodeURIComponent(file.name)}`;
            const fullUrl = R2_STORAGE_URL + fileName;

            document.getElementById('loadingSpinner').style.display = 'flex';

            try {
                // 1. Cloudflare R2 직접 업로드 (Public Bucket / CORS 이용 PUT)
                const r2UploadRes = await fetch(fullUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type },
                    body: file
                });

                // 2. Supabase DB에 정보 저장
                const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/archive_videos`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        project_date: date,
                        tag: tag,
                        title: title,
                        is_single: true,
                        full_url: fullUrl,
                        mode: mode
                    })
                });

                document.getElementById('loadingSpinner').style.display = 'none';

                if (dbRes.ok) {
                    alert('영상이 성공적으로 R2에 업로드되고 아카이브에 등록되었습니다!');
                    closeVideoUploadModal();
                    loadArchiveFromDB();
                } else {
                    alert('DB 저장 실패. 데이터를 확인해 주세요.');
                }
            } catch (e) {
                document.getElementById('loadingSpinner').style.display = 'none';
                console.error(e);
                alert('업로드 과정 중 오류가 발생했습니다.');
            }
        }

        // === 모달 팝업 및 단순 재생 ===
        function openModal(item) {
            const v = document.getElementById('videoRight');
            v.src = item.fullUrl;
            document.getElementById('modalHeaderTitle').textContent = item.title;
            document.getElementById('videoModal').classList.add('active');
        }

        function closeVideo(e) { if (e.target.id === 'videoModal') forceClose(); }
        function forceClose() {
            document.getElementById('videoModal').classList.remove('active');
            const v = document.getElementById('videoRight');
            v.pause(); v.src = '';
        }

        function togglePlay(id) {
            const v = document.getElementById(id);
            if (v.paused) v.play(); else v.pause();
        }

        (async function init() {
            applyAdminMode();
            await loadArchiveFromDB();
        })();
    </script>
</body>
</html>
