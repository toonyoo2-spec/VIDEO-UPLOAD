<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Socra Brandteam Archive</title>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #121212;
            --border-color: #222225;
            --border-hover: #3f3f46;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --container-max-width: 1200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; }

        .grid-layout-align {
            max-width: var(--container-max-width);
            margin-left: auto;
            margin-right: auto;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        /* Header Area */
        header { padding-top: 3.5rem; padding-bottom: 1.8rem; }
        .header-tag { color: var(--accent-red); font-size: 2.6rem; font-weight: 800; letter-spacing: -1px; }

        /* Navigation Bar (3줄 구조) */
        .nav-bar-wrapper {
            position: sticky; top: 0;
            background: rgba(10, 10, 10, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .nav-bar-container { 
            display: flex; 
            flex-direction: column;
            gap: 0.6rem; 
        }

        .nav-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.6rem;
            flex-wrap: wrap;
            width: 100%;
        }

        /* 3행 전용: 가로 드래그/터치 스크롤 */
        .nav-row-scroll {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.6rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            touch-action: pan-x;
            cursor: grab;
            user-select: none;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }

        .nav-row-scroll:active { cursor: grabbing; }
        .nav-row-scroll::-webkit-scrollbar { display: none; }

        .tab-btn, .quick-link-btn {
            height: 36px !important;
            line-height: 1 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            vertical-align: middle !important;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-sizing: border-box;
            margin: 0 !important;
            flex-shrink: 0;
        }

        .tab-btn {
            background: #18181b; border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 0 1rem;
        }
        .tab-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }
        .tab-btn.active { background: var(--accent-red); color: #ffffff; border-color: var(--accent-red); }

        .quick-link-btn {
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 0 0.9rem; gap: 0.5rem;
            font-weight: 600; white-space: nowrap;
        }
        .quick-link-btn:hover { color: var(--text-primary); border-color: var(--accent-red); background: rgba(239, 68, 68, 0.08); }
        .quick-link-btn .date-label { color: var(--accent-red); font-family: monospace; font-weight: 700; }

        /* Main Grid Area */
        main { margin-top: 2.5rem; margin-bottom: 2.5rem; }
        .project-section { margin-bottom: 4.5rem; scroll-margin-top: 180px; }

        .section-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); }
        .date-badge { font-size: 1rem; font-weight: 800; color: #ffffff; background: #18181b; padding: 0.3rem 0.75rem; border-radius: 6px; border: 1px solid var(--border-hover); font-family: monospace; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; align-items: start; }
        .video-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
        .video-card:hover { border-color: var(--accent-red); transform: translateY(-4px); }

        .thumb-cover { position: relative; width: 100%; background: #171717; overflow: hidden; }
        .thumb-cover.landscape { padding-bottom: 56.25%; }
        .thumb-cover.portrait { padding-bottom: 140%; }

        .thumb-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: rgba(239, 68, 68, 0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .play-btn::after { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent #ffffff; margin-left: 2px; }
        .video-card:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: #dc2626; }

        .video-info { padding: 1rem; }
        .video-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent-red); margin-bottom: 0.2rem; }
        .video-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); line-height: 1.4; }

        /* Modal Area */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 1rem;
        }
        .modal-overlay.active { display: flex; }

        .modal-container {
            position: relative; background: #0b0b0b; border-radius: 16px;
            border: 1px solid var(--border-color); overflow: hidden;
            display: flex; flex-direction: column;
            width: 95vw; max-width: 1000px;
            height: 90vh; max-height: 820px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        .modal-header {
            height: 48px; padding: 0 1.25rem; background: #121212;
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }

        .modal-header-title { 
            font-size: 0.95rem; 
            font-weight: 800; 
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 1rem;
        }

        .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; line-height: 1; flex-shrink: 0; }
        .close-btn:hover { color: #ffffff; }

        .modal-body-dual {
            flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; background: #000000; overflow: hidden;
        }

        .modal-body-dual.single-mode {
            grid-template-columns: 1fr;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .dual-column {
            display: flex; 
            flex-direction: column; 
            background: #121212;
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            overflow: hidden;
            height: 100%; 
        }

        .column-header {
            height: 44px;
            padding: 0 1rem; 
            background: #18181b; 
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-shrink: 0;
        }

        .column-header-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 0.5rem;
        }

        .column-header .badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 800; flex-shrink: 0; }
        .left-badge { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
        .right-badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.4); }

        .column-media {
            position: relative;
            flex: 1; width: 100%; height: 100%; background: #000;
            overflow: hidden; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .column-media video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
        }

        .overlay-play-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 64px; height: 64px;
            background: rgba(239, 68, 68, 0.95);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            transition: transform 0.2s, background 0.2s, opacity 0.2s ease;
        }

        .overlay-play-btn::after {
            content: ""; display: block; width: 0; height: 0;
            border-style: solid; border-width: 9px 0 9px 15px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 3px;
        }

        .overlay-play-btn.hidden { opacity: 0; pointer-events: none; }

        .video-control-bar {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 0.8rem 1rem 0.6rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.88), transparent);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .column-media:hover .video-control-bar,
        .column-media:active .video-control-bar {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-container {
            flex: 1;
            height: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .progress-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-red);
            border
