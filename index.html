<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socra Brandteam Archive</title>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #121212;
            --border-color: #222225;
            --border-hover: #3f3f46;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); line-height: 1.6; }

        /* Header Area */
        header { padding: 3.5rem 2rem 1.8rem; max-width: 1200px; margin: 0 auto; }
        .header-tag { color: var(--accent-red); font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; }

        /* 계층형 내비게이션 바 */
        .nav-bar-wrapper {
            position: sticky; top: 0;
            background: rgba(10, 10, 10, 0.88); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100; padding: 1rem 2rem;
        }

        .nav-bar-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.75rem; }
        .all-tab-row { display: flex; align-items: center; }
        .year-tabs-row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }

        .tab-btn {
            background: #18181b; border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 0.4rem 1rem; border-radius: 8px;
            font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }
        .tab-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }
        .tab-btn.active { background: var(--accent-red); color: #ffffff; border-color: var(--accent-red); }

        .project-quick-links-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; padding-top: 0.2rem; }

        .quick-link-btn {
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 0.4rem 0.85rem; border-radius: 8px;
            font-size: 0.82rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .quick-link-btn:hover { color: var(--text-primary); border-color: var(--accent-red); background: rgba(239, 68, 68, 0.08); }
        .quick-link-btn .date-label { color: var(--accent-red); font-family: monospace; font-weight: 700; }

        /* Main Grid */
        main { max-width: 1200px; margin: 2.5rem auto; padding: 0 2rem; }
        .project-section { margin-bottom: 4.5rem; scroll-margin-top: 180px; }

        .section-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); }
        .date-badge { font-size: 1rem; font-weight: 800; color: #ffffff; background: #18181b; padding: 0.3rem 0.75rem; border-radius: 6px; border: 1px solid var(--border-hover); font-family: monospace; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; align-items: start; }
        .video-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
        .video-card:hover { border-color: var(--accent-red); transform: translateY(-4px); }

        .thumb-cover { position: relative; width: 100%; background: #171717; overflow: hidden; }
        .thumb-cover.landscape { padding-bottom: 56.25%; }
        .thumb-cover.portrait { padding-bottom: 140%; }

        .thumb-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: rgba(239, 68, 68, 0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .play-btn::after { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent #ffffff; margin-left: 2px; }
        .video-card:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: #dc2626; }

        .video-info { padding: 1rem; }
        .video-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent-red); margin-bottom: 0.2rem; }
        .video-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }

        /* UI 0% Clean Video Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 1rem;
        }
        .modal-overlay.active { display: flex; }

        .modal-container {
            position: relative; background: #0b0b0b; border-radius: 16px;
            border: 1px solid var(--border-color); overflow: hidden;
            display: flex; flex-direction: column;
            width: 95vw; max-width: 1000px;
            height: 90vh; max-height: 820px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        .modal-header {
            height: 48px; padding: 0 1.25rem; background: #121212;
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }

        .modal-header-title { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }

        .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #ffffff; }

        .modal-body-dual {
            flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; background: #000000; overflow: hidden;
        }

        @media (max-width: 768px) {
            .modal-body-dual { grid-template-columns: 1fr; overflow-y: auto; }
        }

        .dual-column {
            display: flex; flex-direction: column; background: #121212;
            border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden;
        }

        .column-header {
            padding: 0.6rem 1rem; background: #18181b; border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between;
        }

        .column-header .badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 800; }
        .left-badge { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
        .right-badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.4); }

        .column-media {
            position: relative;
            flex: 1; width: 100%; height: 100%; background: #000;
            overflow: hidden; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* 100% 클린 비디오 플레이어 */
        .column-media video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
        }

        footer { max-width: 1200px; margin: 5rem auto 2rem; padding: 2rem; border-top: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="header-tag">Socra Brandteam Archive</div>
    </header>

    <div class="nav-bar-wrapper">
        <div class="nav-bar-container">
            <div class="all-tab-row">
                <button id="btnAll" class="tab-btn active" onclick="filterYear('ALL')">ALL</button>
            </div>
            <div id="yearTabs" class="year-tabs-row"></div>
            <div id="quickLinks" class="project-quick-links-row"></div>
        </div>
    </div>

    <main id="archiveContainer"></main>

    <!-- 듀얼 비교 모달 팝업 -->
    <div id="videoModal" class="modal-overlay" onclick="closeVideo(event)">
        <div class="modal-container">
            <div class="modal-header">
                <span id="modalHeaderTitle" class="modal-header-title">시안 비교</span>
                <button class="close-btn" onclick="forceClose()">✕</button>
            </div>
            <div class="modal-body-dual">
                <!-- 좌측 INTRO -->
                <div class="dual-column">
                    <div class="column-header">
                        <span id="leftTitle">INTRO_01</span>
                        <span class="badge left-badge">ONLY INTRO</span>
                    </div>
                    <div class="column-media" onclick="togglePlay('videoLeft')">
                        <video id="videoLeft" loop playsinline controls></video>
                    </div>
                </div>

                <!-- 우측 예시영상 -->
                <div class="dual-column">
                    <div class="column-header">
                        <span id="rightTitle">INTRO_01 예시영상</span>
                        <span class="badge right-badge">FULL EXAMPLE</span>
                    </div>
                    <div class="column-media" onclick="togglePlay('videoRight')">
                        <video id="videoRight" loop playsinline controls></video>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 SOCRA BRAND TEAM. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // =========================================================
        // 💡 [Supabase Storage CDN URL 기본 구성]
        // Base URL: https://kblwddlquwlvumhwkirl.supabase.co/storage/v1/object/public/videos/
        // 버킷에 올리신 파일명(예: intro_01.mp4, full_01.mp4)을 맞춰서 지정해주세요!
        // =========================================================
        const SUPABASE_STORAGE_URL = "https://kblwddlquwlvumhwkirl.supabase.co/storage/v1/object/public/videos/";

        const projectsArchive = [
            {
                date: "260724",
                title: "INTRO 시안",
                items: [
                    { numKey: "01", introUrl: SUPABASE_STORAGE_URL + "intro_01.mp4", fullUrl: SUPABASE_STORAGE_URL + "full_01.mp4", tag: "OPTION 01", title: "INTRO_REF_01 (UI)", mode: "portrait" },
                    { numKey: "02", introUrl: SUPABASE_STORAGE_URL + "intro_02.mp4", fullUrl: SUPABASE_STORAGE_URL + "full_02.mp4", tag: "OPTION 02", title: "INTRO_REF_02 (IP+THIS IS REAL CLASS)", mode: "portrait" },
                    { numKey: "03", introUrl: SUPABASE_STORAGE_URL + "intro_03.mp4", fullUrl: SUPABASE_STORAGE_URL + "full_03.mp4", tag: "OPTION 03", title: "INTRO_REF_03 (IP+리얼클래스)", mode: "portrait" },
                    { numKey: "04", introUrl: SUPABASE_STORAGE_URL + "intro_04.mp4", fullUrl: SUPABASE_STORAGE_URL + "full_04.mp4", tag: "OPTION 04", title: "INTRO_REF_04 (Jingle+Logo)", mode: "portrait" },
                    { numKey: "05", introUrl: SUPABASE_STORAGE_URL + "intro_05.mp4", fullUrl: SUPABASE_STORAGE_URL + "full_05.mp4", tag: "OPTION 05", title: "INTRO_REF_05 (Voice_Logo)", mode: "portrait" },
                    { numKey: "06", introUrl: SUPABASE_STORAGE_URL + "intro_06.mp4", fullUrl: SUPABASE_STORAGE_URL + "full_06.mp4", tag: "OPTION 06", title: "INTRO_REF_06 (Voice_Logo ani.)", mode: "portrait" }
                ]
            }
        ];

        projectsArchive.sort((a, b) => Number(b.date) - Number(a.date));

        function parseDate(dateStr) {
            const year = '20' + dateStr.substring(0, 2);
            const month = dateStr.substring(2, 4);
            const day = dateStr.substring(4, 6);
            return { year, month, day, formattedFull: `${year}.${month}.${day}` };
        }

        const container = document.getElementById('archiveContainer');
        const yearTabsContainer = document.getElementById('yearTabs');
        const quickLinksContainer = document.getElementById('quickLinks');
        const btnAll = document.getElementById('btnAll');
        let currentFilterYear = 'ALL';

        function renderArchive() {
            container.innerHTML = '';
            quickLinksContainer.innerHTML = '';
            const yearsSet = new Set();

            projectsArchive.forEach((group) => {
                const dateInfo = parseDate(group.date);
                yearsSet.add(dateInfo.year);

                if (currentFilterYear !== 'ALL' && dateInfo.year !== currentFilterYear) return;

                const qLink = document.createElement('button');
                qLink.className = 'quick-link-btn';
                qLink.innerHTML = `<span class="date-label">${dateInfo.formattedFull}</span> ${group.title}`;
                qLink.onclick = () => {
                    const targetSec = document.getElementById(`section-${group.date}`);
                    if (targetSec) targetSec.scrollIntoView({ behavior: 'smooth' });
                };
                quickLinksContainer.appendChild(qLink);

                const section = document.createElement('section');
                section.className = 'project-section';
                section.id = `section-${group.date}`;

                let gridCardsHtml = '';
                group.items.forEach(item => {
                    const jsonItem = JSON.stringify(item).replace(/"/g, '&quot;');
                    gridCardsHtml += `
                        <div class="video-card" onclick="openDualModal(${jsonItem})">
                            <div class="thumb-cover ${item.mode}">
                                <video src="${item.introUrl}#t=0.1" class="thumb-video" preload="metadata" muted></video>
                                <div class="play-btn"></div>
                            </div>
                            <div class="video-info">
                                <div class="video-tag">${item.tag}</div>
                                <div class="video-title">${item.title}</div>
                            </div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="section-header">
                        <span class="date-badge">${dateInfo.formattedFull}</span>
                        <h2 class="section-title">${group.title}</h2>
                    </div>
                    <div class="video-grid">${gridCardsHtml}</div>
                `;
                container.appendChild(section);
            });

            renderYearTabs(Array.from(yearsSet).sort((a, b) => b - a));
        }

        function renderYearTabs(years) {
            yearTabsContainer.innerHTML = '';
            btnAll.className = `tab-btn ${currentFilterYear === 'ALL' ? 'active' : ''}`;

            years.forEach(yr => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${currentFilterYear === yr ? 'active' : ''}`;
                btn.textContent = yr;
                btn.onclick = () => filterYear(yr);
                yearTabsContainer.appendChild(btn);
            });
        }

        function filterYear(year) {
            currentFilterYear = year;
            renderArchive();
        }

        renderArchive();

        // 팝업 오버레이 및 HTML5 비디오 제어
        const modal = document.getElementById('videoModal');
        const modalHeaderTitle = document.getElementById('modalHeaderTitle');
        const leftTitle = document.getElementById('leftTitle');
        const rightTitle = document.getElementById('rightTitle');

        const videoLeft = document.getElementById('videoLeft');
        const videoRight = document.getElementById('videoRight');

        function openDualModal(item) {
            modalHeaderTitle.textContent = item.title;
            leftTitle.textContent = `INTRO_${item.numKey}`;
            rightTitle.textContent = `INTRO_${item.numKey} 예시영상`;

            videoLeft.src = item.introUrl;
            videoRight.src = item.fullUrl;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function togglePlay(id) {
            const v = document.getElementById(id);
            if (v.paused) v.play();
            else v.pause();
        }

        function closeVideo(event) {
            if (event.target === modal) forceClose();
        }

        function forceClose() {
            modal.classList.remove('active');
            videoLeft.pause();
            videoRight.pause();
            videoLeft.src = '';
            videoRight.src = '';
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) forceClose();
        });
    </script>
</body>
</html>
