<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Socra Brandteam Archive</title>



    <style>

        :root {

            --bg-dark: #0a0a0a;

            --card-bg: #121212;

            --border-color: #222225;

            --border-hover: #3f3f46;

            --text-primary: #ffffff;

            --text-secondary: #a1a1aa;

            --accent-red: #ef4444;

            --accent-blue: #3b82f6;

            --container-max-width: 1200px;

        }



        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-dark); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; }



        .grid-layout-align {

            max-width: var(--container-max-width);

            margin-left: auto; margin-right: auto;

            padding-left: 1.2rem; padding-right: 1.2rem;

        }

        @media (min-width: 768px) { .grid-layout-align { padding-left: 2rem; padding-right: 2rem; } }



        header { padding-top: 2.2rem; padding-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; }

        .header-tag { color: var(--accent-red); font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; display: inline-block; }

        @media (min-width: 768px) { header { padding-top: 3.5rem; padding-bottom: 1.8rem; } .header-tag { font-size: 2.6rem; } }



        .btn-admin-action {

            background: var(--accent-red); color: white; border: none; padding: 0.5rem 0.9rem;

            border-radius: 8px; font-weight: 700; cursor: pointer; display: none; transition: background 0.2s; font-size: 0.8rem;

        }

        .btn-admin-action:hover { background: #dc2626; }



        .nav-bar-wrapper {

            position: sticky; top: 0;

            background: rgba(10, 10, 10, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);

            border-bottom: 1px solid var(--border-color); z-index: 100; padding-top: 0.8rem; padding-bottom: 0.8rem;

        }



        .nav-bar-container { display: flex; flex-direction: column; gap: 0.6rem; }

        .nav-row { display: flex; align-items: center; justify-content: flex-start; gap: 0.5rem; flex-wrap: wrap; width: 100%; }



        .nav-row-scroll {

            display: flex; align-items: center; justify-content: flex-start; gap: 0.5rem;

            overflow-x: auto; white-space: nowrap; scrollbar-width: none;

            touch-action: pan-x; cursor: grab; user-select: none; width: 100%;

            -webkit-overflow-scrolling: touch;

        }

        .nav-row-scroll:active { cursor: grabbing; }

        .nav-row-scroll::-webkit-scrollbar { display: none; }



        .tab-btn, .quick-link-btn, .month-btn {

            height: 34px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;

            border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: background 0.2s; flex-shrink: 0;

        }



        .tab-btn { background: #18181b; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0 0.8rem; }

        .tab-btn.active { background: var(--accent-red); color: #ffffff; border-color: var(--accent-red); }



        .month-btn { background: #121215; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0 0.7rem; font-size: 0.75rem; }

        .month-btn.active { background: #27272a; color: #ffffff; border-color: #52525b; }



        .quick-link-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0 0.8rem; gap: 0.4rem; }

        .quick-link-btn .date-label { color: var(--accent-red); font-family: monospace; font-weight: 700; }



        main { margin-top: 1.5rem; margin-bottom: 2.5rem; }

        .project-section { margin-bottom: 3rem; scroll-margin-top: 140px; }



        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.5rem; }

        .section-header-left { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

        .date-badge { font-size: 0.85rem; font-weight: 800; color: #ffffff; background: #18181b; padding: 0.25rem 0.6rem; border-radius: 6px; border: 1px solid var(--border-hover); font-family: monospace; }

        .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }



        .admin-edit-badge { background: #27272a; color: #a1a1aa; border: 1px solid #3f3f46; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; transition: 0.2s; }

        .admin-edit-badge:hover { color: white; border-color: #71717a; }

        .admin-delete-badge { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; transition: 0.2s; }

        .admin-delete-badge:hover { background: var(--accent-red); color: white; }



        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; align-items: start; }

        @media (min-width: 768px) { .video-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; } }



        .video-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.2s; position: relative; }

        .video-card:hover { border-color: var(--accent-red); transform: translateY(-2px); }



        .thumb-cover { position: relative; width: 100%; background: #171717; overflow: hidden; aspect-ratio: 16 / 9; }

        .thumb-cover.portrait { aspect-ratio: 9 / 16; }

        .thumb-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }



        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 42px; height: 42px; background: rgba(239, 68, 68, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }

        .play-btn::after { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #ffffff; margin-left: 2px; }



        .video-info { padding: 0.75rem; }

        .video-tag { font-size: 0.7rem; font-weight: 700; color: var(--accent-red); margin-bottom: 0.2rem; }

        .video-title { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); line-height: 1.3; }

        .video-admin-bar { display: flex; gap: 0.4rem; margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px solid var(--border-color); }



        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 0.5rem; }

        .modal-overlay.active { display: flex; }

        .modal-container { position: relative; background: #0b0b0b; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; width: 100vw; height: 92vh; }



        /* ⚠️ 이 규칙 딱 하나만 존재해야 합니다 (예전에 중복된 낡은 규칙이 이 값을 덮어쓰고 있었음) */

        @media (min-width: 768px) {

            .modal-overlay { padding: 1rem; }

            .modal-container { width: 95vw; max-width: 1800px; height: 94vh; max-height: none; border-radius: 16px; }

        }



        .modal-header { height: 44px; padding: 0 1rem; background: #121212; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }

        .modal-header-title { font-size: 0.9rem; font-weight: 800; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 0.5rem; }

        .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; padding: 0.2rem; }



        .modal-body-dual { flex: 1; display: grid; grid-template-columns: 1fr; gap: 0.8rem; padding: 0.6rem; background: #000000; overflow-y: auto; }

        @media (min-width: 768px) { .modal-body-dual { grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; overflow: hidden; } }

        .modal-body-dual.single-mode { grid-template-columns: 1fr !important; }



        .dual-column { display: flex; flex-direction: column; background: #121212; border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; min-height: 320px; }

        @media (min-width: 768px) { .dual-column { height: 100%; min-height: 0; } }



        .column-header { height: 38px; padding: 0 0.8rem; background: #18181b; border-bottom: 1px solid var(--border-color); font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }

        .column-header .badge { font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: 800; }

        .left-badge { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }

        .right-badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.4); }



        .column-media { position: relative; flex: 1; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 240px; }

        .column-media video { width: 100%; height: 100%; object-fit: contain; background: #000; }



        .overlay-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 52px; height: 52px; background: rgba(239, 68, 68, 0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; transition: opacity 0.2s ease; }

        .overlay-play-btn::after { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent #ffffff; margin-left: 2px; }

        .overlay-play-btn.hidden { opacity: 0; }



        .video-control-bar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 0.6rem 0.8rem 0.5rem; background: linear-gradient(to top, rgba(0, 0, 0, 0.88), transparent); display: flex; align-items: center; gap: 0.6rem; z-index: 10; opacity: 1; }

        @media (min-width: 768px) { .video-control-bar { opacity: 0; } .column-media:hover .video-control-bar { opacity: 1; } }



        .progress-container { flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; }

        .progress-bg { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; position: relative; overflow: hidden; }

        .progress-fill { width: 0%; height: 100%; background: var(--accent-red); border-radius: 2px; }

        .time-display { font-size: 0.7rem; font-family: monospace; color: #ffffff; font-weight: 600; white-space: nowrap; }



        .admin-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 1rem; }

        .admin-modal-overlay.active { display: flex; }

        .admin-modal-box { background: #121212; border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 12px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 0.8rem; }

        .admin-modal-title { font-size: 1rem; font-weight: 800; color: white; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; }

        .admin-input-group { display: flex; flex-direction: column; gap: 0.3rem; }

        .admin-input-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); }

        .admin-input { background: #18181b; border: 1px solid var(--border-color); color: white; padding: 0.5rem; border-radius: 6px; outline: none; font-size: 0.85rem; }

        .admin-btn-row { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.8rem; }

        .btn-cancel { background: #27272a; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

        .btn-submit { background: var(--accent-red); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }



        .top-btn { position: fixed; bottom: 1.5rem; right: 1rem; width: 40px; height: 40px; background: #18181b; border: 1px solid var(--border-hover); color: var(--text-primary); border-radius: 50%; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 99; }



        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); color: white; z-index: 20000; align-items: center; justify-content: center; font-weight: 700; flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; }

    </style>

</head>

    <header class="grid-layout-align">

        async function loadArchiveFromDB() {

            try {

                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }

                });

                const dbProjects = await projRes.json();



                const vidRes = await fetch(`${SUPABASE_URL}/rest/v1/archive_videos?select=*`, {

                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }

                });

                const dbVideos = await vidRes.json();



                displayArchive = JSON.parse(JSON.stringify(defaultProjectsArchive));



                if (Array.isArray(dbProjects)) {

                    dbProjects.forEach(p => {

                        let targetGroup = displayArchive.find(g => (p.id && g.id === p.id));

                        if (!targetGroup) {

                            targetGroup = { id: p.id, date: p.date, title: p.title, items: [] };

                            displayArchive.push(targetGroup);

                        } else {

                            targetGroup.title = p.title;

                        }



                        const matchingVids = dbVideos.filter(v => v.project_date === p.date);

                        matchingVids.forEach(v => {

                            if(!targetGroup.items.some(existVid => existVid.id === v.id || existVid.fullUrl === v.full_url)) {

                                targetGroup.items.push({

                                    id: v.id,

                                    tag: v.tag,

                                    title: v.title,

                                    isSingle: v.is_single !== false,

                                    leftTitle: v.left_title,

                                    rightTitle: v.right_title,

                                    fullUrl: v.full_url,

                                    introUrl: v.intro_url,

                                    mode: v.mode

                                });

                            }

                        });

                    });

                }



                displayArchive.sort((a, b) => Number(b.date) - Number(a.date));

                renderArchive();

            } catch (e) {

                console.error("데이터 로드 중 오류:", e);

                displayArchive = JSON.parse(JSON.stringify(defaultProjectsArchive));

                renderArchive();

            }

        function parseDate(dateStr) {

            const year = '20' + dateStr.substring(0, 2);

            const month = dateStr.substring(2, 4);

            const day = dateStr.substring(4, 6);

            return { year, month, day, formattedFull: `${year}.${month}.${day}` };

        }

            displayArchive.forEach((group, idx) => {

                    if (dateInfo.year !== currentFilterYear) return;

                    availableMonthsSet.add(parseInt(dateInfo.month, 10));



                    if (currentFilterMonth !== 'ALL' && parseInt(dateInfo.month, 10) !== parseInt(currentFilterMonth, 10)) {

        function renderMonthTabs(months) {

        }



        function formatTime(sec) {

            if (isNaN(sec) || !isFinite(sec)) return "00:00";

            const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);

            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;

        }



        function resetProgressUI(fillId, timeId) {

            document.getElementById(fillId).style.width = '0%';

            document.getElementById(timeId).textContent = "00:00 / 00:00";

        }



        function updateProgress(v, fillId, timeId) {

            const fill = document.getElementById(fillId);

            const time = document.getElementById(timeId);

            if (v.duration && !isNaN(v.duration) && v.duration > 0) {

                const pct = (v.currentTime / v.duration) * 100;

                fill.style.width = `${pct}%`;

                time.textContent = `${formatTime(v.currentTime)} / ${formatTime(v.duration)}`;

            } else {

                fill.style.width = '0%';

                time.textContent = `00:00 / ${formatTime(v.duration)}`;

            }

        }



        function seekVideo(e, videoId) {

            const v = document.getElementById(videoId);

            const rect = e.currentTarget.getBoundingClientRect();

            const pos = (e.clientX - rect.left) / rect.width;

            if (v.duration && !isNaN(v.duration)) { v.currentTime = pos * v.duration; }

        }



        videoLeft.addEventListener('timeupdate', () => updateProgress(videoLeft, 'fillLeft', 'timeLeft'));

        videoRight.addEventListener('timeupdate', () => updateProgress(videoRight, 'fillRight', 'timeRight'));

        videoLeft.addEventListener('ended', () => { overlayLeft.classList.remove('hidden'); });

        videoRight.addEventListener('ended', () => { overlayRight.classList.remove('hidden'); });



        function closeVideo(event) { if (event.target === modal) forceClose(); }

        function forceClose() {

            modal.classList.remove('active');

            videoLeft.pause(); videoRight.pause();

            videoLeft.src = ''; videoRight.src = '';

            document.body.style.overflow = 'auto';

        }



        function setupQuickLinksScroll() {

            const slider = document.getElementById('quickLinks');

            let isDown = false;

            let startX, scrollLeft;



            slider.addEventListener('mousedown', (e) => {

                isDown = true;

                startX = e.pageX - slider.offsetLeft;

                scrollLeft = slider.scrollLeft;

            });

            slider.addEventListener('mouseleave', () => { isDown = false; });

            slider.addEventListener('mouseup', () => { isDown = false; });

            slider.addEventListener('mousemove', (e) => {

                if(!isDown) return;

                e.preventDefault();

                const x = e.pageX - slider.offsetLeft;

                const walk = (x - startX) * 2;

                slider.scrollLeft = scrollLeft - walk;

            });



            slider.addEventListener('wheel', (e) => {

                if (e.deltaY !== 0) {

                    e.preventDefault();

                    slider.scrollLeft += e.deltaY;

                }

            }, { passive: false });

        }



        (async function init() {

            applyAdminMode();

            setupQuickLinksScroll();

            await loadArchiveFromDB();

        })();

    </script>
